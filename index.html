<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>الألعاب الإلكترونية: متعة وأمان – منصة محترف</title>
<style>
:root{--bg:#eef6ff;--card:#fff;--tx:#12263f;--pri:#0e4a86;--acc:#f29c11;--ok:#1b9e4b;--no:#d83a3a;--ln:#cfe0f3;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0d1a2b;--card:#16283f;--tx:#eaf2fc;--pri:#7db8f5;--ln:#2a4466}}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;font-family:Tahoma,"Segoe UI",Arial,sans-serif;font-size:20px;line-height:1.8;background:var(--bg);color:var(--tx);overflow-x:hidden}
body:before{content:"";position:fixed;inset:0;background:radial-gradient(circle at 15% 20%,#3b7bd633,transparent 40%),radial-gradient(circle at 85% 80%,#f29c1133,transparent 40%);animation:mv 12s ease-in-out infinite alternate;z-index:-1}
@keyframes mv{to{transform:scale(1.2) translateY(-20px)}}
header{display:flex;align-items:center;gap:14px;padding:12px 18px;background:var(--card);border-bottom:4px solid var(--acc)}
header img{width:78px;height:78px;object-fit:contain}header h1{font-size:24px;margin:0;color:var(--pri)}header small{font-size:15px;opacity:.8}
main{max-width:860px;margin:auto;padding:16px}
.card{background:var(--card);border:2px solid var(--ln);border-radius:20px;padding:18px 20px;margin:14px 0;box-shadow:0 4px 14px #0001}
.card h3{margin:0 0 6px;color:var(--pri);font-size:24px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
button{font:inherit;cursor:pointer;border:0;border-radius:16px;padding:12px 18px;background:var(--pri);color:#fff;font-weight:700;transition:.15s}
button:hover{transform:translateY(-2px)}button.o{background:var(--acc);color:#222}button.g{background:transparent;color:var(--pri);border:2px solid var(--pri)}
.big{font-size:22px;padding:18px}
.opt{display:block;width:100%;text-align:right;margin:10px 0;background:var(--card);color:var(--tx);border:3px solid var(--ln);font-size:21px}
.opt.ok{background:var(--ok);color:#fff;border-color:var(--ok)}.opt.no{background:var(--no);color:#fff;border-color:var(--no)}
input.in{width:100%;font:inherit;font-size:21px;padding:12px;border-radius:14px;border:3px solid var(--ln);background:var(--card);color:var(--tx)}
.bar{height:12px;background:var(--ln);border-radius:9px;overflow:hidden;margin:8px 0}.bar i{display:block;height:100%;background:var(--acc);transition:.3s}
.fb{margin-top:12px;padding:12px 16px;border-radius:14px;font-weight:700}.fb.ok{background:#1b9e4b22;color:var(--ok)}.fb.no{background:#d83a3a22;color:var(--no)}
.shake{animation:sh .45s}@keyframes sh{20%,60%{transform:translateX(-12px)}40%,80%{transform:translateX(12px)}}
.pop{position:fixed;font-size:46px;pointer-events:none;z-index:9;animation:up 1.4s ease-out forwards}
@keyframes up{to{transform:translateY(-240px) rotate(40deg);opacity:0}}
.ico{font-size:44px}.pill{display:inline-block;background:var(--acc);color:#222;border-radius:20px;padding:0 14px;font-size:16px;font-weight:700}
li{margin:6px 0}.top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
</style></head><body>

{t:"ما هي الألعاب الإلكترونية؟",i:"🎮",c:[["الأهداف 🎯","في نهاية الدرس ستكون قادرًا على أن: <ul><li>تناقش مخاطر الألعاب الإلكترونية.</li><li>تشرح سُبل تجنُّب هذه المخاطر.</li><li>تحدِّد تأثير الألعاب على صحتك وكيف تتعامل معه بمساعدة أسرتك.</li></ul>"],["الألعاب الإلكترونية 🕹️","<ul><li>هي ألعاب توجد على الأجهزة الإلكترونية وتعتمد على <b>عالم افتراضي</b> (غير حقيقي).</li><li>يحدث فيها تفاعل بين اللاعب والجهاز، أو بين عدة لاعبين على الأجهزة، فأصبحت جزءًا من حياتنا.</li></ul>"],["مخاطر الألعاب الإلكترونية ⚠️","للألعاب ثلاثة أنواع من المخاطر: <b>الجسدية 🦴 – الأمنية 🔒 – النفسية 🧠</b><br>والأهم أن نكون <b>أذكياء</b> في استخدامها وأن نحمي أنفسنا جسديًا وأمنيًا ونفسيًا."]],q:["t1","t5","s2","s7","n5","k5","k2","s1","m3","c5"]},
{t:"المخاطر الجسدية",i:"🦴",c:[["ما هي؟ 😵","<ul><li>الجلوس لفترات طويلة بوضع خطأ يسبب آلامًا في <b>الظهر والرقبة</b>.</li><li>التركيز المستمر على الشاشة يسبب <b>جفاف العين</b> وتشوُّشًا في الرؤية.</li><li>قضاء وقت طويل في اللعب مع قلة الرياضة يضر الجسم و<b>يزيد الوزن</b>.</li></ul>"],["كيف نتجنبها؟ ✅","<ul><li>أخذ فترات زمنية منتظمة من الراحة والنظر بعيدًا عن الشاشة 👀.</li><li>ممارسة الأنشطة البدنية والرياضة ⚽.</li></ul>"]],q:["b3","k1","k4","k8","k13","m1","s8","s9","n1","c1"]},

{t:"المخاطر النفسية",i:"🧠",c:[["ما هي؟ 😠","<ul><li>بعض اللاعبين يستخدمون ألفاظًا غير لائقة أو <b>يتنمرون</b> على الآخرين.</li><li>عندما يصبح اللعب أهم من كل شيء قد يولِّد <b>مشاعر عدوانية</b> تؤثر على الدراسة والنوم وقضاء الوقت مع العائلة والأصدقاء.</li></ul>"],["كيف نتجنبها؟ ✅","<ul><li>عدم الرد على المتنمرين 🚫، وإبلاغ الأهل أو المسؤولين عن اللعبة.</li><li>عدم استخدام الألعاب كوسيلة للهروب من المشاكل.</li><li>تحديد وقت معين للعب والالتزام به ⏰.</li></ul>"]],q:["b1","b4","b5","k6","k10","k14","m4","s3","s6","s11"]},
{t:"دور الأسرة والموازنة",i:"👨‍👩‍👧",c:[["دور الأسرة 🏠","<ul><li><b>وضع قواعد واضحة:</b> يضع الأهل قواعد لوقت اللعب ونوع الألعاب، ويجب على الطالب أن يتعاون معهم.</li><li><b>المشاركة والحوار:</b> يشارك الأهل أبناءهم في اختيار الألعاب، ويكون هناك حوار مفتوح حول أي مشكلة قد يواجهونها.</li></ul>"],["الموازنة ⚖️","يجب الموازنة بين اللعب وممارسة هوايات أخرى (مثل القراءة والرسم)، أو قضاء الوقت مع العائلة والأصدقاء."],["لاحظ أن 🔎","الألعاب الإلكترونية وسيلة ممتعة، ولكن الأهم أن نكون أذكياء في استخدامها، وأن نحمي أنفسنا جسديًا وأمنيًا ونفسيًا.<br><b>تطبيق عملي:</b> صمِّم ملصقًا إرشاديًا في PowerPoint بعنوان «اللعب بمسئولية = متعة + أمان + صحة» يحتوي على صورة أو رمز للعبة ونص قصير عن المخاطر ونصائح لتجنبها."]],q:["k7","k9","k12","s5","f1","f5","c5x","n2","n3","e3"].map(x=>x=="c5x"?"c4":x)}

const ALL=Object.keys(Q);
let ac;function snd(ok){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();const seq=ok?[[523,0],[659,.12],[784,.24],[1047,.36]]:[[220,0],[165,.18]];seq.forEach(([f,t])=>{const o=ac.createOscillator(),g=ac.createGain();o.type=ok?"triangle":"sawtooth";o.frequency.value=f;o.connect(g);g.connect(ac.destination);const s=ac.currentTime+t;g.gain.setValueAtTime(.2,s);g.gain.exponentialRampToValueAtTime(.001,s+.25);o.start(s);o.stop(s+.26)})}catch(e){}}
function fx(ok){snd(ok);const em=ok?["🎉","⭐","😃","👏","✨"]:["😢","❌","😞"];for(let i=0;i<9;i++){const d=document.createElement("div");d.className="pop";d.textContent=em[i%em.length];d.style.left=(8+Math.random()*80)+"vw";d.style.top=(45+Math.random()*30)+"vh";d.style.animationDelay=(i*.06)+"s";document.body.appendChild(d);setTimeout(()=>d.remove(),1800)}if(!ok){const c=$(".qc");c&&c.classList.add("shake")}}
function home(){app.innerHTML=`<div class="card"><h3>👋 أهلًا بك في درس: عالم الألعاب الإلكترونية – متعة وأمان</h3>اختر جزءًا من الدرس لتتعلمه بطريقة سهلة، ثم أجب عن <b>10 أسئلة</b> من أسئلة الكتاب على كل جزء.</div><div class="grid">${S.map((s,i)=>`<button class="big" onclick="les(${i})"><span class="ico">${s.i}</span><br>${i+1}. ${s.t}</button>`).join("")}<button class="big o" onclick="quiz(ALL,'الاختبار الشامل – كل أسئلة الملف ('+ALL.length+' سؤالًا)')"><span class="ico">🏆</span><br>الاختبار الشامل بكل أسئلة الملف</button></div>`;scrollTo(0,0)}
function les(i){const s=S[i];app.innerHTML=`<div class="top"><button class="g" onclick="home()">⬅ الرئيسية</button><span class="pill">الجزء ${i+1} من ${S.length}</span></div><h2>${s.i} ${s.t}</h2>${s.c.map(c=>`<div class="card"><h3>${c[0]}</h3>${c[1]}</div>`).join("")}<button class="big o" onclick="quiz(S[${i}].q,'أسئلة: ${s.t}')">✏️ ابدأ الأسئلة (10 أسئلة)</button>`;scrollTo(0,0)}
let st;
function quiz(keys,title){st={k:keys.slice(),i:0,sc:0,title,done:0};show()}
function show(){const k=st.k[st.i],q=Q[k],n=st.k.length;let h=`<div class="top"><button class="g" onclick="home()">⬅ الرئيسية</button><b>${st.title}</b></div><div class="bar"><i style="width:${st.i/n*100}%"></i></div><div>سؤال ${st.i+1} من ${n} • ⭐ ${st.sc}</div><div class="card qc"><h3>${q[1]}</h3><div id="ans">`;
if(q[0]=="tf")h+=`<button class="opt" onclick="pick(1)">✔ صح</button><button class="opt" onclick="pick(0)">✘ خطأ</button>`;
else if(q[0]=="mc")h+=q[2].map((o,j)=>`<button class="opt" onclick="pick(${j})">( ${L[j]} ) ${o}</button>`).join("");
else h+=`<input class="in" id="wi" placeholder="اكتب إجابتك هنا"><br><br><button onclick="chk()">تحقق ✔</button>`;
app.innerHTML=h+`</div><div id="fb"></div></div>`;scrollTo(0,0)}
function pick(v){if(st.done)return;st.done=1;const q=Q[st.k[st.i]],c=q[0]=="tf"?q[2]:q[3],ok=v==c;[...document.querySelectorAll(".opt")].forEach((b,j)=>{const val=q[0]=="tf"?(j==0?1:0):j;if(val==c)b.classList.add("ok");else if(j==(q[0]=="tf"?(v?0:1):v))b.classList.add("no")});fin(ok,q[0]=="tf"?(c?"صح":"خطأ"):L[c]+") "+q[2][c])}
function chk(){if(st.done)return;const q=Q[st.k[st.i]],v=nz($("#wi").value);if(!v)return;st.done=1;fin(q[3].some(a=>v.includes(nz(a))),q[2])}
function fin(ok,ans){if(ok)st.sc++;fx(ok);$("#fb").innerHTML=`<div class="fb ${ok?"ok":"no"}">${ok?"😃 إجابة صحيحة! أحسنت 🎉":"😢 إجابة خاطئة. الإجابة الصحيحة: "+ans}</div><br><button class="o" onclick="nxt()">${st.i+1<st.k.length?"السؤال التالي ➡":"عرض النتيجة 🏁"}</button>`}
function nxt(){st.done=0;st.i++;st.i<st.k.length?show():res()}
function res(){const n=st.k.length,p=Math.round(st.sc/n*100),e=p>=85?"🏆😃":p>=50?"👍🙂":"💪😢";snd(p>=50);app.innerHTML=`<div class="card" style="text-align:center"><div class="ico" style="font-size:80px">${e}</div><h2>${st.title}</h2><h3>نتيجتك: ${st.sc} من ${n} (${p}%)</h3><p>${p>=85?"ممتاز! أنت لاعب ذكي وآمن!":p>=50?"جيد! راجع الدرس وحاول مرة أخرى.":"لا تقلق، راجع الدرس وأعد المحاولة."}</p><button class="o" onclick="quiz(st.k,st.title)">🔄 إعادة</button> <button onclick="home()">🏠 الرئيسية</button></div>`}
home();
</script></body></html>
